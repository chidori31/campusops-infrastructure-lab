name: campusops

services:
  # =========================================================
  # MAIN POSTGRESQL DATABASE
  # =========================================================
  db:
    image: postgres:18-alpine
    container_name: campusops-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - campusops_postgres_data:/var/lib/postgresql

    ports:
      - "5432:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

    networks:
      - campusops-network


  # =========================================================
  # FASTAPI APPLICATION
  # =========================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: campusops-api

    env_file:
      - .env

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

    networks:
      - campusops-network


  # =========================================================
  # TEST POSTGRESQL DATABASE
  #
  # Starts only with:
  # docker compose --profile test ...
  # =========================================================
  test-db:
    image: postgres:18-alpine
    container_name: campusops-test-db

    profiles:
      - test

    environment:
      POSTGRES_DB: campusops_test
      POSTGRES_USER: campusops_test
      POSTGRES_PASSWORD: campusops_test_password

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U campusops_test -d campusops_test"
        ]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

    networks:
      - campusops-network


  # =========================================================
  # PYTEST
  #
  # Uses isolated PostgreSQL test database.
  # Does not touch the main campusops database.
  # =========================================================
  tests:
    build:
      context: .
      dockerfile: Dockerfile

    profiles:
      - test

    environment:
      APP_NAME: CampusOps Test
      APP_ENV: testing
      DEBUG: "false"

      POSTGRES_HOST: test-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: campusops_test
      POSTGRES_USER: campusops_test
      POSTGRES_PASSWORD: campusops_test_password

      AD_ENABLED: "false"
      AD_SERVER: ad-dc
      AD_PORT: "389"
      AD_DOMAIN: corp.lab
      AD_BASE_DN: DC=corp,DC=lab
      AD_BIND_USER: svc-campusops@corp.lab
      AD_BIND_PASSWORD: test_only

    depends_on:
      test-db:
        condition: service_healthy

    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && pytest -v --cov=app --cov-report=term-missing"
      ]

    networks:
      - campusops-network


  # =========================================================
  # SAMBA ACTIVE DIRECTORY DOMAIN CONTROLLER
  #
  # Domain:
  # CORP.LAB
  #
  # NetBIOS:
  # CORP
  #
  # Starts with profile:
  # docker compose --profile infra up -d
  # =========================================================
  ad-dc:
    build:
      context: ./infra/active-directory
      dockerfile: Dockerfile

    container_name: campusops-ad-dc

    hostname: dc01
    domainname: corp.lab

    privileged: true

    profiles:
      - infra

    environment:
      AD_REALM: CORP.LAB
      AD_NETBIOS_DOMAIN: CORP

      AD_ADMIN_PASSWORD: ${AD_ADMIN_PASSWORD}
      AD_SERVICE_PASSWORD: ${AD_SERVICE_PASSWORD}
      AD_USER_PASSWORD: ${AD_USER_PASSWORD}

    volumes:
      - campusops_ad_lib:/var/lib/samba
      - campusops_ad_cache:/var/cache/samba
      - campusops_ad_config:/etc/samba

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ldapsearch -x -H ldap://127.0.0.1:389 -D 'svc-campusops@corp.lab' -w \"$${AD_SERVICE_PASSWORD}\" -b 'DC=corp,DC=lab' -s base dn >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

    restart: unless-stopped

    networks:
      - campusops-network


  # =========================================================
  # ZABBIX DATABASE
  #
  # Separate PostgreSQL database for Zabbix itself.
  # =========================================================
  zabbix-db:
    image: postgres:17-alpine
    container_name: campusops-zabbix-db

    profiles:
      - infra

    environment:
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}

    volumes:
      - campusops_zabbix_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U zabbix -d zabbix"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    restart: unless-stopped

    networks:
      - campusops-network


  # =========================================================
  # ZABBIX SERVER
  # =========================================================
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.4-latest
    container_name: campusops-zabbix-server

    profiles:
      - infra

    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}

    depends_on:
      zabbix-db:
        condition: service_healthy

    ports:
      - "10051:10051"

    restart: unless-stopped

    networks:
      - campusops-network


  # =========================================================
  # ZABBIX WEB UI
  #
  # http://localhost:8080
  # =========================================================
  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.4-latest
    container_name: campusops-zabbix-web

    profiles:
      - infra

    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: "10051"

      DB_SERVER_HOST: zabbix-db
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}

      PHP_TZ: Europe/Moscow

    depends_on:
      zabbix-db:
        condition: service_healthy
      zabbix-server:
        condition: service_started

    ports:
      - "8080:8080"

    restart: unless-stopped

    networks:
      - campusops-network


# =========================================================
# NETWORK
# =========================================================
networks:
  campusops-network:
    name: campusops-network


# =========================================================
# PERSISTENT VOLUMES
# =========================================================
volumes:
  campusops_postgres_data:
    name: campusops-postgres-data

  campusops_ad_lib:
    name: campusops-ad-lib

  campusops_ad_cache:
    name: campusops-ad-cache

  campusops_ad_config:
    name: campusops-ad-config

  campusops_zabbix_data:
    name: campusops-zabbix-data